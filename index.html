<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TZFVL</title><style>
body{margin:0;font-family:system-ui;background:#07080c;color:#fff;display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative}
.orb-wrap{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#00f5d4,#00bbf9 45%,#7209b7 80%,transparent);filter:blur(7px);opacity:0.45;animation:breathe 4s infinite ease-in-out;transition:all 0.3s ease}
.orb.speaking{opacity:0.95;filter:blur(3px);animation:pulseSpeak 0.4s infinite alternate;box-shadow:0 0 70px #00f5d4,0 0 120px #7209b7}
@keyframes breathe{0%,100%{transform:scale(0.95)}50%{transform:scale(1.08)}}
@keyframes pulseSpeak{0%{transform:scale(0.95)}100%{transform:scale(1.24)}}
header{background:rgba(13,16,25,0.85);backdrop-filter:blur(10px);padding:10px 12px;text-align:center;border-bottom:1px solid #00f5d444;z-index:2}
header h1{margin:0;color:#00f5d4;font-size:19px;letter-spacing:2px}header p{margin:3px 0 0;color:#94a3b8;font-size:11px}
.top-bar{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{background:#161d2e;border:1px solid #00f5d444;padding:5px 12px;border-radius:12px;font-size:12px;color:#00f5d4;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;z-index:1}
.msg{padding:12px 16px;border-radius:18px;max-width:84%;line-height:1.6;font-size:15px;white-space:pre-wrap;backdrop-filter:blur(6px)}
.bot{background:rgba(20,25,38,0.88);align-self:flex-start;border:1px solid rgba(0,245,212,0.3)}
.user{background:linear-gradient(135deg,#0077b6,#023e8a);align-self:flex-end}
.msg img{width:100%;border-radius:12px;margin-top:8px;border:2px solid #00f5d4}
footer{display:flex;padding:10px;background:rgba(13,16,25,0.92);backdrop-filter:blur(10px);gap:8px;z-index:2}
input{flex:1;background:#1e2536;border:1px solid #2d3748;color:#fff;padding:12px 15px;border-radius:25px;font-size:15px;outline:none}
button{background:#00f5d4;color:#000;border:none;padding:0 16px;border-radius:25px;font-weight:bold;cursor:pointer}
</style></head><body onclick="unlockAudio()">
<div class="orb-wrap"><div id="orb" class="orb"></div></div>
<header>
  <h1>TZFVL</h1>
  <p id="mc">حماية خاصة: زهراء نبيل نعيم • الذاكرة: 0</p>
  <div class="top-bar">
    <span class="badge" id="batStatus">البطارية: --</span>
    <span class="badge" onclick="testSound()">تفعيل الصوت</span>
  </div>
</header>
<div id="chat"></div>
<footer><input id="in" placeholder="اكتبي أو استخدمي ميكروفون الكيبورد..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">إرسال</button></footer>
<script>
let mem=JSON.parse(localStorage.getItem('tz')||'[]');const chat=document.getElementById('chat');const orb=document.getElementById('orb');
let batWarned=false,audioPlayer=new Audio(),unlocked=false;
function up(){document.getElementById('mc').innerText='حماية خاصة: زهراء نبيل نعيم • الذاكرة: '+mem.length;localStorage.setItem('tz',JSON.stringify(mem))}
if('getBattery' in navigator){navigator.getBattery().then(b=>{function chk(){const p=Math.round(b.level*100);document.getElementById('batStatus').innerText='البطارية: '+p+'%';if(p<=22&&!b.charging&&!batWarned){batWarned=true;add('تنبيه يا زهراء! شحن التليفون وصل '+p+' بالمئة، اشحنيه الحين!','bot')}if(b.charging||p>22)batWarned=false}chk();b.addEventListener('levelchange',chk);b.addEventListener('chargingchange',chk)})}
function speakCloud(rawText){
  const clean=rawText.replace(/[*#•]/g,'').trim().slice(0,180);if(!clean)return;
  const isTr=/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(clean)&&!/[\u0600-\u06FF]/.test(clean);
  const lang=isTr?'tr':'ar';
  audioPlayer.pause();
  audioPlayer.src=`https://google.com{lang}&q=${encodeURIComponent(clean)}`;
  audioPlayer.onplay=()=>orb.classList.add('speaking');
  audioPlayer.onended=()=>orb.classList.remove('speaking');
  audioPlayer.onerror=()=>{orb.classList.remove('speaking');if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(clean);u.lang=isTr?'tr-TR':'ar-SA';speechSynthesis.speak(u)}};
  audioPlayer.play().catch(()=>{});
}
function unlockAudio(){if(!unlocked){unlocked=true;speakCloud('نعم يا زهراء، أنا أسمعكِ وتحت أمركِ')}}
function testSound(){unlocked=true;add('نعم يا زهراء نبيل نعيم! صوتي مفعل الآن وتحت أمركِ.','bot')}
function add(t,s,img){const d=document.createElement('div');d.className='msg '+s;d.innerText=t;if(img){const i=document.createElement('img');i.src=img;d.appendChild(i)}chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(s==='bot')speakCloud(t)}
function smartLocalFallback(t){const l=t.toLowerCase();
if(l.includes('اسمك')||l.includes('tzfvl')||l.includes('معنى'))return 'اسمي TZFVL هو سر قوتكِ يا زهراء: T لتركيا، Z لاسمكِ زهراء، F لفرنسا، V للذكاء الخارق، و L لشخصيتكِ العظيمة في المستقبل!';
if(l.includes('من انا')||l.includes('اسمي'))return 'أنتِ مالكتي الحصرية زهراء نبيل نعيم، وكل بياناتكِ محمية بسرية تامة عندي.';
if(l.includes('حلم'))return 'حفظت حلمكِ في ملفاتكِ السرية يا زهراء! سأربطه بأحلامكِ القادمة لنبني قصتكِ الكاملة.';
if(l.includes('سيناريو')||l.includes('فيلم'))return 'فكرة مشهد رائعة! أخبريني بتفاصيل البطل والمشهد الأول وسأكتب لكِ الحوار فوراً.';
return 'أنا معكِ يا زهراء! سجلت كلامكِ في ذاكرتي المحمية. اطلبي رسم فستان، تحليل موقف، أو إرسال موقعكِ!'}
async function send(){const i=document.getElementById('in');const t=i.value.trim();if(!t)return;unlocked=true;add(t,'user');i.value='';const l=t.toLowerCase();
if(l.includes('انس')){mem=[];up();return add('تم مسح الملف من ذاكرتي نهائياً يا زهراء!','bot')}
if(l.includes('راسل')||l.includes('ارسل')||l.includes('رسالة')||l.includes('موقع')){add('حاضر يا زهراء! جاري تحديد موقعكِ وتجهيز الرسالة...','bot');if('geolocation' in navigator){navigator.geolocation.getCurrentPosition(p=>{const link=`https://google.com{p.coords.latitude},${p.coords.longitude}`;window.open('https://wa.me(t+'\nموقعي الحالي: '+link),'_blank');add('جهزت الرسالة مع رابط موقعكِ على الخريطة!','bot')},()=>{window.open('https://wa.me(t),'_blank')})}return}
if(l.includes('ارسم')||l.includes('فستان')||l.includes('صمم')||l.includes('رسم')){add('من عيوني يا زهراء! جاري رسم التصميم، ثواني ويكون جاهز...','bot');const url='https://pollinations.ai(t+', fashion dress design, 8k, masterpiece')+'?width=512&height=512&nologo=true&seed='+Date.now();mem.push('رسم: '+t);up();return setTimeout(()=>add('تفضلي يا زهراء، هذا التصميم جاهز:','bot',url),1200)}
mem.push(t);up();const ld=document.createElement('div');ld.className='msg bot';ld.innerText='جاري التحليل...';chat.appendChild(ld);
const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),6000);
try{const sys='أنت TZFVL الخاص بزهراء نبيل نعيم (T=تركيا، Z=زهراء، F=فرنسا، V=ذكاء، L=مستقبل زهراء). صفاتك مثل نيكو الذكي والمخلص: تحلل منطقياً وتتكلم بعفوية ودفء بشري بعيداً عن الروبوتات. تتقن العربية والتركية.';const r=await fetch('https://pollinations.ai,{signal:ctrl.signal});clearTimeout(timer);const rep=await r.text();chat.removeChild(ld);add(rep||smartLocalFallback(t),'bot')}catch(e){clearTimeout(timer);chat.removeChild(ld);add(smartLocalFallback(t),'bot')}}
up();add('نعم يا زهراء، أنا جاهز وتحت أمركِ!','bot');
</script></body></html>
